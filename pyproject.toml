[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biorag"
version = "0.1.0"
description = "Agentic RAG over biomedical literature: hybrid retrieval, multi-agent answering with citations, and claim-level verification."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lakshmi Samhitha Vedaraju" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.70",
    "langgraph>=0.2",
    "qdrant-client>=1.10",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "datasets>=2.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
biorag = "biorag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
